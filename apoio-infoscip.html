<style>

.number{font-size:10.5px}.card-actions{text-align:right;margin-top:4px}.card-actions button{border:1px solid #b7cde5;background:white;color:#205289;border-radius:6px;padding:3px 7px;cursor:pointer;font-size:10px}

.technical-review-alert{margin:0 0 11px;padding:8px 10px;border-left:4px solid #ba4137;background:#fff0ed;color:#8c241b;font-weight:700;font-size:11px;line-height:1.45}

.technical-assistant textarea{min-height:64px;resize:vertical}

.technical-assistant .tech-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.technical-assistant .tech-actions button{padding:8px 10px;background:#e2ecf8;border:1px solid #b1c8e3;color:#184977;border-radius:7px;font-weight:700;cursor:pointer;font-size:11px}
.technical-assistant .tech-actions .primary{background:#0d7450;color:#fff;border-color:#0d7450}

@media screen and (max-width:700px){.sheet{margin:0;box-shadow:none;padding:12px 7px;min-height:0}.heading{grid-template-columns:82px 1fr 62px}.heading img{width:79px}.heading h1{font-size:16px}.heading .issue{font-size:8px}.info-grid{grid-template-columns:1fr 1fr;margin-bottom:12px}.area-table th{font-size:9px}.area-table td{font-size:10px}.notifications{margin:0;padding:4px}.row-heading{grid-template-columns:1fr 1.2fr}.detail-titles,.detail-values{grid-template-columns:20px 26% 26% 1fr;gap:3px}.detail-titles strong,.detail-values .editable{font-size:9px}}
@media print{@page{size:A4 portrait;margin:9mm}html,:root,body{background:white!important}body{background:white;-webkit-print-color-adjust:exact;print-color-adjust:exact}.toolbar,.card-actions,.technical-assistant{display:none!important}.sheet{width:100%;box-shadow:none;margin:0;padding:0;min-height:0}.heading{grid-template-columns:155px 1fr 115px}.heading h1{font-size:21px}.info-grid{margin-bottom:22px}.editable{border-bottom:0}.editable:empty::before{content:''}.local{break-inside:avoid-page;page-break-inside:avoid}.bottom-note{font-size:9px}}
</style></head><body>
<div class="toolbar"><div><strong>Notificação Projeto — documento de apoio</strong><small>Confira ou complete os campos sublinhados. Sugestões técnicas são revisadas manualmente e não alteram a Ficha nem o INFOSCIP.</small><small id="pdfFileName" aria-live="polite">Nome do arquivo: aguardando os dados do PSCIP.</small></div><div><button id="copyAll" type="button">Copiar descrições</button> <button id="copyFileName" type="button" disabled>Copiar nome do PDF</button> <button id="print" class="primary" type="button">Imprimir / salvar como PDF</button></div></div>
<main class="sheet" id="sheet"><div id="pending" class="pending">Recebendo as notificações da Ficha do Processo...</div></main>
<script>
(function(){'use strict';
const ORIGEM=location.origin;const sheet=document.getElementById('sheet');let dados=null;
let nomeArquivoPdf='';
function nomePdfPeloPscip(numero){
  const valor=String(numero==null?'':numero).normalize('NFKC').trim()
    .replace(/[\\/:*?"<>|\u0000-\u001f\u007f]/g,'-')
    .replace(/\s+/g,' ').replace(/^[.\s-]+|[.\s-]+$/g,'').slice(0,72);
  const semNumero=!valor||/^(?:dispensad[oa]|não informado|nao informado|sem pscip)$/i.test(valor);
  return 'Notificação Projeto - '+(semNumero?'PSCIP não informado':valor)+'.pdf';
}
function atualizarNomeArquivoPdf(projeto){
  nomeArquivoPdf=nomePdfPeloPscip(projeto);
  document.title=nomeArquivoPdf.replace(/\.pdf$/i,'');
  document.getElementById('pdfFileName').textContent='Nome sugerido ao salvar: '+nomeArquivoPdf;
  document.getElementById('copyFileName').disabled=false;
}

const formatoData=()=>new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Sao_Paulo',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(new Date());
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function campo(valor,rotulo){const e=el('span','editable',String(valor||''));e.contentEditable='true';e.role='textbox';e.tabIndex=0;e.setAttribute('aria-label',rotulo);e.dataset.placeholder='Preencher';e.spellcheck=false;return e}
function cabecalho(titulo,valor){const b=el('div');b.append(el('strong','',titulo),campo(valor,titulo));return b}
function cabecalhoLinha(tipo,descricao){const row=el('div','row-heading');const a=el('div');const b=el('div');a.append(el('strong','','Local Irregularidade'),campo(tipo,'Local irregularidade'));b.append(el('strong','','Descrição'),campo(descricao,'Descrição do local'));row.append(a,b);return row}

// MK: geração 100% local, a partir do texto declarado. Não inventar itens normativos.
const NORMA_CBMMG='https://bombeiros.mg.gov.br/normastecnicas.html';
function limparMarcadorTecnico(texto){
  return String(texto||'').replace(/^\s*(?:[✓✔]\s*)?Texto técnico fundamentado\s*[:\-]?\s*/i,'').trim();
}
function extrairReferenciaIT(texto){
  const s=limparMarcadorTecnico(texto);
  const m=s.match(/(?:contrariando|em desacordo com)\s+(?:(?:o|os|a|as)\s+)?((?:itens?|al[ií]neas?|subitens?)\s+.{1,110}?)\s+da\s+IT\s*0?(\d{1,2})(?:\s+do\s+CBMMG)?(?=[.,;\s]|$)/i);
  if(!m)return null;
  return {dispositivo:m[1].trim(),it:String(Number(m[2])).padStart(2,'0')};
}
function retirarCitacaoFinal(texto){
  return limparMarcadorTecnico(texto)
   .replace(/[,;\s]*(?:contrariando|em desacordo com)\s+(?:(?:o|os|a|as)\s+)?(?:itens?|al[ií]neas?|subitens?)\s+.{1,110}?\s+da\s+IT\s*0?\d{1,2}(?:\s+do\s+CBMMG)?\s*\.?\s*$/i,'')
   .replace(/[\s,;.]+$/,'').trim();
}
function chaves(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase()}
function divergenciaTema(item,descricao){
  const i=chaves(item),d=chaves(descricao);
  if(i.includes('PORTA CORTA-FOGO') && /(?:CAIXA|DISPOSITIVO|ABRIGO|REGISTRO)\s+(?:DE|DO|DA)?\s*RECALQUE/.test(d) && !d.includes('PORTA'))
    return 'O item é PORTA CORTA-FOGO, mas a descrição trata de RECALQUE. Confira o registro original antes de usar uma sugestão.';
  if(i.includes('RECALQUE') && d.includes('PORTA CORTA-FOGO') && !d.includes('RECALQUE'))
    return 'O item é RECALQUE, mas a descrição trata de PORTA CORTA-FOGO. Confira o registro original.';
  return '';
}
function padronizarCondicao(s){
  let t=retirarCitacaoFinal(s);
  if(!t)return '';
  t=t.replace(/\s+/g,' ').replace(/[.;,\s]+$/,'').trim();
  if(/^(?:Foi constatad[oa]|Constatou-se|Verificou-se)\b/i.test(t))return t;
  if(/^Falta\s/i.test(t))return 'Foi constatada a '+t[0].toLowerCase()+t.slice(1);
  if(/^Aus[eê]ncia\s/i.test(t))return 'Foi constatada a '+t[0].toLowerCase()+t.slice(1);
  if(/^N[aã]o\s+h[aá]\s/i.test(t))return 'Foi constatado que '+t[0].toLowerCase()+t.slice(1);
  return 'Foi constatada a seguinte irregularidade: '+t[0].toLowerCase()+t.slice(1);
}
function formatarDispositivoNormativo(valor){
  let v=String(valor||'').trim().replace(/[.,;\s]+$/,'');
  if(!v)return '';
  const alinea=v.match(/^(\d+(?:\.\d+)*),\s*al[ií]nea\s*[“\"]?([a-z0-9]+)[”\"]?$/i);
  if(alinea)return 'a alínea “'+alinea[2]+'” do item '+alinea[1];
  if(/^(?:(?:o|os|a|as)\s+)?(?:itens?|al[ií]neas?|subitens?)\b/i.test(v)){
    if(/^(?:o|os|a|as)\s+/i.test(v))return v;
    return (/^al[ií]nea/i.test(v)?'a ': /^(?:itens|subitens)/i.test(v)?'os ':'o ')+v;
  }
  if(/^\d+(?:\.\d+)*(?:\s+e\s+|\s*,\s*)\d/.test(v))return 'os itens '+v;
  return 'o item '+v;
}
function montarSugestaoLocal(texto,dispositivo,it){
  const cond=padronizarCondicao(texto);
  const ref=formatarDispositivoNormativo(dispositivo);
  const norm=String(it||'').trim();
  if(!cond)return '';
  const encerramento=cond.replace(/[\s.;]+$/,'');
  if(!ref||!/^\d{1,2}$/.test(norm))return encerramento+'.';
  return encerramento+', contrariando '+ref+' da IT '+norm.padStart(2,'0')+' do CBMMG.';
}
function painelSugestaoTecnica(ir,descricaoEditavel){
  const original=String(ir.descricao||'');
  const bloco=el('div','technical-assistant');bloco.hidden=true;
  const heading=el('h3','','Sugestão técnica para conferência — uso opcional');
  bloco.append(heading,el('p','','A descrição original permanece na Ficha. A sugestão só será usada neste PDF se você confirmar a condição constatada e a fundamentação.'));
  const originalBox=el('div','original-box',original||'(sem descrição na Ficha)');
  bloco.append(el('label','','Descrição original registrada'),originalBox);
  const condLabel=el('label','','Condição efetivamente constatada (revise antes de gerar)');
  const propostaAnterior=String(ir.textoTecnico||'').trim();
  const referenciaDisponivel=Array.isArray(ir.fundamentosNormativos) && ir.fundamentosNormativos.length===1
    ? ir.fundamentosNormativos[0] : null;
  const resumoProposta=ir.statusTecnico==='sugerido' && propostaAnterior && !divergenciaTema(ir.item,propostaAnterior)
    ? propostaAnterior : '';
  const cond=el('textarea');cond.value=retirarCitacaoFinal(resumoProposta||original);cond.maxLength=2500;cond.setAttribute('aria-label','Condição efetivamente constatada');
  condLabel.append(cond);bloco.append(condLabel);
  const campos=el('div','tech-fields');const itLabel=el('label','','Número da IT');
  const it=el('input');it.type='text';it.maxLength=2;it.inputMode='numeric';it.placeholder='Ex.: 08';it.setAttribute('aria-label','Número da Instrução Técnica');
  itLabel.append(it);
  const dispLabel=el('label','','Dispositivo normativo (item, subitem ou alínea)');
  const disp=el('input');disp.type='text';disp.maxLength=130;disp.placeholder='Ex.: 5.8.1.1 ou alínea “a” do item 5.3.4';disp.setAttribute('aria-label','Dispositivo normativo');
  dispLabel.append(disp);campos.append(itLabel,dispLabel);bloco.append(campos);
  const origemRef=extrairReferenciaIT(resumoProposta||original) || extrairReferenciaIT(original);
  if(origemRef){it.value=origemRef.it;disp.value=origemRef.dispositivo;}
  else if(referenciaDisponivel && /^\d{1,2}$/.test(String(referenciaDisponivel.it||'').trim()) && referenciaDisponivel.item){
    it.value=String(referenciaDisponivel.it).padStart(2,'0');
    disp.value=String(referenciaDisponivel.item);
  }
  const info=el('p','',resumoProposta
    ? 'Há sugestão técnica registrada durante a vistoria. O texto foi aproveitado como rascunho, não como comprovação normativa. Confira a condição e os dispositivos antes do uso. '
    : 'A referência, quando encontrada, veio do texto original ou dos dados técnicos já registrados; não foi verificada novamente. ');
  const link=el('a','','Conferir as normas técnicas do CBMMG');link.href=NORMA_CBMMG;link.target='_blank';link.rel='noopener noreferrer';info.append(link);bloco.append(info);
  const resultLabel=el('label','','Sugestão (editável antes da aprovação)');
  const result=el('textarea','tech-result');result.placeholder='A sugestão aparecerá aqui. Sem dispositivo e IT confirmados, apenas um rascunho será exibido.';result.maxLength=3500;result.setAttribute('aria-label','Sugestão de descrição técnica');resultLabel.append(result);bloco.append(resultLabel);
  const confirmLabel=el('label','norm-check');const check=el('input');check.type='checkbox';
  confirmLabel.append(check,el('span','', 'Conferi os fatos observados, o enquadramento do item e o dispositivo na IT aplicável. Autorizo usar esta sugestão somente no PDF de apoio.'));
  bloco.append(confirmLabel);
  const actions=el('div','tech-actions');
  const gerar=el('button','','Montar sugestão');gerar.type='button';
  const copiarSug=el('button','','Copiar sugestão');copiarSug.type='button';copiarSug.disabled=true;
  const aplicar=el('button','primary','Usar no PDF (não altera a Ficha)');aplicar.type='button';aplicar.disabled=true;
  const restaurar=el('button','','Restaurar original no PDF');restaurar.type='button';
  actions.append(gerar,copiarSug,aplicar,restaurar);bloco.append(actions);
  const status=el('p','technical-status','Preencha ou confira o dispositivo normativo. A sugestão não será gravada no servidor.');status.role='status';bloco.append(status);
  let montado=false;
  function informar(msg,erro=false){status.textContent=msg;status.classList.toggle('error',erro)}
  function textoComReferenciaAtual(){
    const dispositivo=formatarDispositivoNormativo(disp.value);
    const norm=it.value.trim().padStart(2,'0');
    return !!dispositivo && result.value.trim().endsWith('contrariando '+dispositivo+' da IT '+norm+' do CBMMG.');
  }
  function permissao(){
    const ok=montado && check.checked && /^\d{1,2}$/.test(it.value.trim()) && !!disp.value.trim()
      && !!result.value.trim() && textoComReferenciaAtual() && !divergenciaTema(ir.item,cond.value)
      && !divergenciaTema(ir.item,result.value);
    copiarSug.disabled=!ok;aplicar.disabled=!ok;
  }
  [cond,it,disp].forEach(c=>c.addEventListener('input',()=>{montado=false;check.checked=false;permissao()}));
  result.addEventListener('input',()=>{check.checked=false;permissao()});
  check.addEventListener('change',permissao);
  gerar.addEventListener('click',()=>{
    const assunto=divergenciaTema(ir.item,cond.value);
    if(assunto){result.value='';montado=false;check.checked=false;permissao();informar(assunto,true);return;}
    if(!retirarCitacaoFinal(cond.value)) {montado=false;check.checked=false;permissao();informar('Informe a condição que foi efetivamente constatada. Não é seguro criar um fato a partir do nome do item.',true);return;}
    result.value=montarSugestaoLocal(cond.value,disp.value,it.value);
    montado=true;check.checked=false;permissao();
    if(!/^\d{1,2}$/.test(it.value.trim())||!disp.value.trim())informar('Rascunho SEM fundamentação: informe o número da IT e o dispositivo correto, confira na norma e gere novamente. Não pode ser aplicado ao PDF.');
    else informar('Confira se a descrição e a referência são adequadas ao caso; depois marque a confirmação para habilitar a cópia e o uso no PDF.');
  });
  copiarSug.addEventListener('click',()=>{permissao();if(!copiarSug.disabled)copiar(result.value)});
  aplicar.addEventListener('click',()=>{permissao();if(aplicar.disabled)return;descricaoEditavel.textContent=result.value;informar('Sugestão aplicada somente à prévia do PDF. A Ficha e a planilha não foram alteradas.');});
  restaurar.addEventListener('click',()=>{descricaoEditavel.textContent=original;informar('Descrição original restaurada nesta prévia. Nenhuma informação foi gravada.');});
  return bloco;
}

async function copiar(s){try{await navigator.clipboard.writeText(String(s||''))}catch(e){const text=el('textarea');text.value=String(s||'');document.body.append(text);text.select();document.execCommand('copy');text.remove()}}
